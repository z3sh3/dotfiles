# default interval is 15 seconds
set -g status-interval 60
# uncomment if using alacritty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',alacritty:Tc'
set-option -a terminal-features 'alacritty:RGB'
# Activity and Events
set -g aggressive-resize on
set -g monitor-activity on
set -g visual-activity off
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -g focus-events on
set -gq allow-passthrough on
set -g xterm-keys on
set-option -g history-limit 100000
set-option -sg escape-time 10
set-option -g default-shell /usr/bin/fish
# setting the prefix from C-b to C-a
set -g prefix C-q
# unset default prefix key
unbind C-b
# unset kill window map
unbind k
# toggle synchronize-panes
unbind C-s
# use key binding to reload configuaration file
bind r source-file ~/.tmux.conf \; display "Reloaded!"
# keep directory when opening new window
bind c new-window -c "#{pane_current_path}"
# splitting panes with | and -
bind -n M-= split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
# maybe show/hide command line pane??
bind - split-window -v -c "#{pane_current_path}" -l 20%
# enable mouse on globally
set -g mouse on
# set vi as default editor
set -g status-keys vi
bind C-y set-window-option synchronize-panes
# close pane and window
bind -n M-C-w kill-pane
bind -n M-C-k kill-window

# resize current pane
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# unbind default select-pane keybinds
unbind-key -T root C-h
unbind-key -T root C-j
unbind-key -T root C-k
unbind-key -T root C-l

# start window and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind -n M-0 run-shell "~/.tmux/script/toggle-popup.sh"
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind-key -n C-M-t new-window
bind-key -T prefix x kill-pane
unbind-key -T root Escape
unbind-key -T root WheelUpStatus
unbind-key -T copy-mode-vi PageUp
unbind-key -T copy-mode-vi PageDown
unbind-key -T prefix d

# use vim as copy mode editor
setw -g mode-keys vi
# use system clipboard instead
set -s set-clipboard external
set -s copy-command 'xsel -i -b'
unbind -T copy-mode-vi Space;
unbind -T copy-mode-vi Enter;
bind -T copy-mode-vi v send-keys -X begin-selection
# use <C-v> after enter copy mode to switch to rectangle copy mode(resolve vim line number leading chars)
bind -T copy-mode-vi y send-keys -X copy-pipe "xsel -i -b"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi C-j send-keys -X page-down
bind -T copy-mode-vi Space send-keys -X page-down
bind -T copy-mode-vi C-k send-keys -X page-up
bind -T copy-mode-vi u send-keys -X page-up
bind -T copy-mode-vi Y send-keys -X copy-pipe-line-and-cancel "xsel -i -b"
# work with n/vim navigation
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R
bind-key -T copy-mode-vi M-\\ select-pane -l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|nvim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"
bind-key -n M-\\ if-shell "$is_vim" "send-keys M-\\\\"  "select-pane -l"

# session management
# FZF session manager: prefix + s (popup)
bind m display-popup -E -w 60% -h 50% "~/.tmux/script/session-manage.sh"
bind s switch-client -l

# URL hints: overlay the current pane, burn a letter label into the start of
# every visible URL (lowercase letters, a-z then aa..zz), press the label to open
# that URL with xdg-open. q / Esc cancels. The overlay is a snapshot: tmux cannot
# draw over a live pane, so the popup re-renders the captured screen at exactly
# the pane geometry (-b none keeps the border out of the size maths). URLs that
# wrap onto the next screen row are opened whole, both when the terminal wrapped
# them and when the program did it itself (TUI gutter, fold, pager); the latter
# relies on the line stopping near the pane edge, tune with --gutter N if your
# editor/TUI reserves more than 8 columns.
bind u run-shell "tmux display-popup -E -b none -w '#{pane_width}' -h '#{pane_height}' -x '#{pane_left}' -y '#{pane_top}' '~/.tmux/script/url-hints.py --pane #{pane_id}'"

gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3b4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
marrs_green="#008c8c"
yellow_soft="#EBCB8B"
session_fg="#1c1b1e"
session_bg="#5e818a"

# default statusbar colors
set -g status-position bottom
set -g status-justify absolute-centre
# set -g mode-style 'bg=#a3be8c,fg=gray,noreverse'
set-window-option -g mode-style "bg=#ced4da,fg=#4c566a,reverse"
set-option -g status-style fg=colour243,bg=#1c1b1e
set-option -g status-right '#(gitmux -cfg ~/.gitmux.conf "#{pane_current_path}")'
set-option -g status-left-style fg=color3
set-option -g status-left-length 128
set-option -g status-left "#[fg=${session_fg},bg=${session_bg},bold]#S#[fg=${session_bg},bg=default]#[fg=${session_bg},bg=default]#(tmux display-message -p '#{pane_current_path}' | sed 's#$HOME#~#g')#[align=absolute-centre]#[fg=color220]󰇥 #[fg=#5981a2]"
# set-option -g status-left "#[align=absolute-centre]󰇥 "
# active window title colors
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
# set -g window-status-current-format "#I:#W"
set-window-option -g window-status-current-style fg=colour250,bg=default,bright
# pane border
set -g pane-border-style "fg=#868e96"
set -g pane-active-border-style "fg=${marrs_green},bg=default,bold"
set -g display-panes-time 100000  # 100 seconds
set -g pane-border-status off
# set -g pane-border-format " #{pane_current_command}  #{pane_current_path} "
set -g pane-border-indicators colour
set -g window-status-activity-style fg=#889a9a,bg=default
set -g message-style "fg=${yellow_soft},bg=default"
# set -g mode_style "fg=${gray_dark},bg=${blue_muted}"
set -g popup-border-lines rounded
# tmux 3.8 defaults popup-style to bg=themedarkgrey (gray15/#262626), which
# overrides the terminal default background; force default to inherit alacritty's bg
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "bg=default,fg=${blue_muted}"

# plugins
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
