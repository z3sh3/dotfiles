#: kitty.conf
#: Mirrors ~/.dotfiles/config/alacritty/alacritty.toml. Each block notes the
#: alacritty key it comes from; anything kitty cannot express is left as a
#: comment next to the block it belonged to.
#: vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{ (alacritty [font])
#:   normal.family = "SauceCodePro", size = 11.5
#: The bare alias name "SauceCodePro" from fontconfig cannot be used here: kitty
#: resolves a family with fc_match(family, ..., FC_MONO) first and on this box
#: "SauceCodePro:spacing=100" resolves to Noto Sans Mono, so kitty silently ends
#: up with Noto Sans Mono. Use the real family name instead.
font_family             SauceCodePro Nerd Font
# font_family           SauceCodePro Nerd Font Mono   # single-cell icon variant
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               11.5
disable_ligatures       never
#: builtin_box_drawing = true: kitty always draws box-drawing characters with
#: its own scalable strokes, thickness is tunable via box_drawing_scale.
# box_drawing_scale     0.001, 1, 1.5, 2
#: Underline: move it further down from the baseline, leave the thickness
#: untouched. The font's own value is post.underlinePosition = -50/1000 em,
#: i.e. only ~0.6px below the baseline at 11.5pt, which looks cramped.
#: Units: no suffix = pt, or px, or % of the font's original value.
#: Negative moves the line down, positive moves it up; it is clamped to
#: cell_height - 1, so add "modify_font cell_height +2px" if it stops moving.
modify_font underline_position +1
#: }}}

#: Fallback fonts {{{ (alacritty has no equivalent; this replaces the fontconfig
#: <alias><prefer> chain from ~/.config/fontconfig/fonts.conf, which kitty does
#: not use for glyph level fallback)
#: symbol_map is authoritative: a codepoint inside a mapped range is always drawn
#: with that font, kitty does NOT fall back again if the font lacks it. So the
#: ranges below are limited to what TsangerJinKai05 actually contains.
#: CJK punctuation, Hiragana, Katakana, Bopomofo
symbol_map U+3000-U+3003,U+3005,U+3007-U+3012,U+3014-U+3017,U+301C,U+301E,U+3041-U+3093,U+30A1-U+30F6,U+3105-U+3129 TsangerJinKai05
#: CJK unified ideographs (U+4E00-U+9FA5 is exactly what the kai font covers)
symbol_map U+4E00-U+9FA5 TsangerJinKai05
#: vertical forms, CJK compatibility forms, fullwidth ASCII
symbol_map U+FE10-U+FE19,U+FE30-U+FE44,U+FE47-U+FE48,U+FE4B-U+FE4C,U+FE4F,U+FF01-U+FF65,U+FFE0-U+FFE1,U+FFE3,U+FFE5-U+FFE6,U+FFED-U+FFEE TsangerJinKai05
#: Deliberately not mapped, so they keep going through kitty's automatic
#: fallback instead of showing missing glyph boxes:
#:   U+3400-U+4DBF CJK ext A      (kai font misses 55 codepoints)
#:   U+F900-U+FAFF compat ideographs, U+9FA6-U+9FFF newest ideographs
#:   U+FF66-U+FF9F halfwidth katakana, U+3200-U+33FF enclosed CJK
#: Add e.g. "symbol_map U+3400-U+4DB5 TsangerJinKai05" if ext A in kai style
#: matters more than those 55 rare characters.
#: Emoji needs no symbol_map: Noto Color Emoji is the only colour emoji font
#: installed, and kitty picks a colour font automatically for characters with
#: emoji presentation (and for anything followed by U+FE0F). Mapping the whole
#: U+1F000-U+1FAFF block would instead force text glyphs such as playing cards,
#: mahjong tiles, chess and alchemical symbols into the emoji font and show
#: missing glyphs for them.
#: }}}

#: Colors {{{ (alacritty [colors])
#:   primary.background / primary.foreground
background              #1c1b1e
foreground              #d8dee9
#: window.opacity = 1
background_opacity      1.0
#: alacritty sets no ANSI palette, so its built-in Tomorrow Night palette is
#: reproduced 1:1 here to keep both terminals looking identical.
color0                  #1d1f21
color8                  #666666
color1                  #cc6666
color9                  #d54e53
color2                  #b5bd68
color10                 #b9ca4a
color3                  #f0c674
color11                 #e7c547
color4                  #81a2be
color12                 #7aa6da
color5                  #b294bb
color13                 #c397d8
color6                  #8abeb7
color14                 #70c0b1
color7                  #c5c8c6
color15                 #eaeaea
#: draw_bold_text_with_bright_colors = true has no kitty counterpart: kitty
#: never remaps bold text onto the bright palette.
#: transparent_background_colors = true has no kitty counterpart.
#: }}}

#: Cursor and bell {{{ (alacritty defaults + [bell] duration = 0)
cursor_shape            block
#: alacritty cursor.blinking = false
cursor_blink_interval   0
enable_audio_bell       no
visual_bell_duration    0.0
#: }}}

#: Window {{{ (alacritty [window])
#:   decorations = "None", opacity = 1, dynamic_title = false
hide_window_decorations yes
remember_window_size    yes
window_margin_width     1
single_window_margin_width 1
draw_minimal_borders    yes
#: startup_mode = "Maximized" is not a config key in this build, launch with:
#:   kitty --start-as=maximized
#:   (or put that flag in the .desktop file)
#: dynamic_padding = true has no kitty counterpart, the margins above are fixed.
#: dynamic_title = false: kitty has no way to freeze the title against apps,
#: only shell integration can be told to stop setting it:
# shell_integration       enabled,no-title
#: }}}

#: Scrolling (alacritty [scrolling] history = 100000)
scrollback_lines        100000

#: Mouse {{{ (alacritty [mouse] hide_when_typing = true)
#: A negative mouse_hide_wait hides the pointer as soon as text is typed.
mouse_hide_wait         -1.0
focus_follows_mouse     yes
copy_on_select          clipboard
strip_trailing_spaces   always
#: }}}

#: Shell (alacritty [terminal.shell] program = "tmux")
shell                   /usr/bin/tmux
#: alacritty exports [env] TERM="alacritty"; kitty sets its own TERM for children,
#: pin it explicitly so an inherited TERM (alacritty, screen, dumb, ...) from the
#: launching shell or from a stale session environment can never leak through.
#: tmux then replaces it inside panes with its own default-terminal (tmux-256color).
term                    xterm-kitty
#: alacritty [debug] prefer_egl = true has no kitty counterpart (kitty uses GL).

#: Keys {{{
map ctrl+shift+c         copy_to_clipboard
map ctrl+shift+v         paste_from_clipboard
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+end       scroll_end
#: alacritty binding { key = "Insert", mods = "Shift", action = "Paste" }
map shift+insert         paste_from_clipboard
#: alacritty unbinds Ctrl+Shift+Space (its Vi-mode toggle); this kitty build
#: does not bind that chord at all, so there is nothing to unbind.

#: URL hints: select a visible URL with the keyboard and open it via xdg-open.
#: Chord: Ctrl+Shift+E. Ctrl+` was the alacritty chord but the Fcitx5 IME grabs
#: it, so it never reaches kitty. Ctrl+Shift+E is already kitty's own default for
#: this feature (open_url / kitty_mod+e), so it shadows nothing and no IME or
#: tmux binding uses it. Other chords still free under kitty_mod (ctrl+shift):
#: d, i, m, y - e.g. ctrl+shift+i if E turns out to be too close to something.
#: Keep the `kitten` action form, NOT `launch --type=overlay kitten hints`:
#: the hints kitten marks the screen text kitty feeds it on stdin, and that only
#: happens when kitty itself spawns it as an overlay kitten
#: (Boss.run_kitten_with_metadata feeds the overlaid window's text for
#: type_of_input=screen-ansi). Via `launch` it is an ordinary child whose stdin
#: is the fresh, empty overlay pty, so it fails immediately with:
#:   Error: No matches found with pattern: (?:ftps|git|...|https)://...
map ctrl+shift+e         kitten hints --type=url --program xdg-open
#: alacritty hints also has mouse.enabled = true; kitty hints is keyboard only.
#: Mouse side: Ctrl+Shift+click a URL that kitty has detected (detect_urls).
#: }}}
